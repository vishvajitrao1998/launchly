{% extends "base.html" %}
{% block page %}login{% endblock %}
{% block title %}Forgot Password · LetsPublic{% endblock %}
{% block content %}
<div class="auth card">
  <h2>Forgot Your Password</h2>
  <p class="muted">Enter the email you signed up with and we'll send you a link to choose a new one.</p>
  <form method="post" class="form-card flat">{% csrf_token %}
    <label class="field"><span>Email</span>{{ form.email }}
      {% for e in form.email.errors %}<em class="err show">{{ e }}</em>{% endfor %}</label>
    <button class="btn btn-primary btn-lg" type="submit">Send Reset Link</button>
  </form>
  <p class="muted"><a class="link" href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
