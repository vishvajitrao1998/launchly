{% extends "base.html" %}
{% block page %}signup{% endblock %}
{% block title %}Sign up · Launchly{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Create your account</h1>
  <p class="muted">Free forever for standard launches.</p>
  <form method="post" class="form-card flat">{% csrf_token %}
    {% for f in form %}
    <label class="field"><span>{{ f.label }}</span>{{ f }}
      {% for e in f.errors %}<em class="err show">{{ e }}</em>{% endfor %}</label>
    {% endfor %}
    <button class="btn btn-primary btn-lg" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a class="link" href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
