{% extends "base.html" %}
{% block page %}analytics{% endblock %}
{% block title %}Analytics · LetsPublic{% endblock %}
{% block scripts_head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>{% endblock %}
{% block content %}
<div class="col-1100">
  <section class="page-head row">
    <div><h1>Analytics</h1><p class="muted">How your launches are performing.</p></div>
    <div class="an-controls" id="anControls">
      <select id="anProduct" data-size="md" aria-label="Product"><option value="">All Products</option></select>
      <div id="rangeTabs" class="tabs" style="margin-top: 10px;">
        <button class="tab" data-days="7">7 days</button>
        <button class="tab on" data-days="30">30 days</button>
        <button class="tab" data-days="90">90 days</button>
      </div>
    </div>
  </section>
  <div id="anBody"><div class="skeleton" style="height:120px"></div></div>
</div>
{% endblock %}
