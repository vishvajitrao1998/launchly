{% extends "base.html" %}
{% block page %}revenue{% endblock %}
{% block title %}Revenue · Launchly{% endblock %}
{% block scripts_head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>{% endblock %}
{% block content %}
<div class="col-1100">
  <section class="page-head row">
    <div><h1>Revenue</h1><p class="muted">Payments received, shown separately per currency.</p></div>
    <div id="rangeTabs" class="tabs">
      <button class="tab" data-days="7">7 days</button>
      <button class="tab on" data-days="30">30 days</button>
      <button class="tab" data-days="90">90 days</button>
      <button class="tab" data-days="365">1 year</button>
      <button class="tab" data-custom>Custom</button>
    </div>
  </section>
<div id="customRange" class="custom-range" hidden>
    <label class="field"><span>From</span><input type="date" id="fromDate"></label>
    <label class="field"><span>To</span><input type="date" id="toDate"></label>
    <button class="btn btn-primary" id="applyRange">Apply</button>
  </div>

  <div id="revBody"><div class="skeleton" style="height:140px"></div></div>

  <section class="block">
    <div class="block-head"><h2>Payments</h2>
      <div class="an-controls">
        <div id="curTabs" class="tabs">
          <button class="tab on" data-cur="">All</button>
          <button class="tab" data-cur="INR">INR</button>
          <button class="tab" data-cur="USD">USD</button>
        </div>
        <div id="statusTabs" class="tabs">
          <button class="tab on" data-st="paid">Paid</button>
          <button class="tab" data-st="failed">Failed</button>
        </div>
      </div>
    </div>
    <div class="card tbl-wrap">
      <table class="tbl left">
        <thead><tr><th>Date</th><th>User</th><th>Item</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead>
        <tbody id="payRows"></tbody>
      </table>
    </div>
    <div id="payPager"></div>
  </section>
</div>
{% endblock %}
