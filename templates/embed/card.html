<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><base target="_blank">
<title>{{ product.name }} on {{ site }}</title>
<style>
  :root{--bg:#fffdf9;--text:#2b1d16;--muted:#7b665a;--border:#eaded0;--accent:#e0475b;--soft:#fdebe6}
  body.dark{--bg:#1e1814;--text:#f7eee5;--muted:#b5a495;--border:#3a3028;--accent:#ff7b6b;--soft:#3b2420}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px}
  a{color:inherit;text-decoration:none}
  .card{display:flex;align-items:center;gap:14px}
  .logo{width:56px;height:56px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  .body{flex:1;min-width:0;display:grid;gap:2px}
  .name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .prem{font-style:normal;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,#fbbf24,#f97316);color:#3b2200}
  .tag{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cat{font-size:12px;color:var(--muted)}
  .vote{width:54px;height:58px;border-radius:13px;border:1px solid var(--border);display:grid;place-items:center;align-content:center;font-weight:800;font-size:14px}
  .vote b{color:var(--accent);font-size:11px;line-height:1} .vote i{font-style:normal}
  .card:hover .name{color:var(--accent)}
  .foot{font-size:11px;color:var(--muted)} .foot a{font-weight:800;color:var(--accent)}
</style>
</head>
<body class="{{ theme }}">
  <a class="card" href="{{ url }}" rel="noopener">
    <span class="logo" style="background:{{ product.category.color }}">{% if product.logo %}<img src="{{ product.logo.url }}" alt="">{% else %}{{ initials }}{% endif %}</span>
    <span class="body">
      <span class="name">{{ product.name }}{% if product.is_premium %}<i class="prem">★ Premium</i>{% endif %}</span>
      <span class="tag">{{ product.tagline }}</span>
      <span class="cat">{{ product.category.icon }} {{ product.category.name }}</span>
    </span>
    <span class="vote"><b>▲</b><i>{{ product.upvote_count }}</i></span>
  </a>
  <div class="foot">Featured on <a href="{{ url }}" rel="noopener">{{ site }}</a></div>
</body>
</html>
