{% extends "base.html" %}
{% block page %}error{% endblock %}
{% block title %}{{ status }} · {{ title }}{% endblock %}
{% block content %}
<div class="err-page">
  <div class="err-emoji">{{ emoji }}</div>
  <div class="err-code">{{ status }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="hero-cta" style="justify-content:center">
    <a class="btn btn-primary btn-lg" href="{% url 'home' %}">Back to Home</a>
  </div>
</div>
{% endblock %}
